services:
  vector-db:
    image: qdrant/qdrant
    ports:
      - 6333:6333

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: administrator
      POSTGRES_PASSWORD: example
      POSTGRES_DB: ai_knowledge_platform
    ports:
      - 5432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080